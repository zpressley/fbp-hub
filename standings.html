<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Live Standings - FBP Hub</title>
    <link rel="icon" type="image/x-icon" href="/favicon.ico">
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png">
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png">
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">
    <link rel="manifest" href="/site.webmanifest">
    <meta name="theme-color" content="#EF3E42">
    <link rel="stylesheet" href="css/styles.css?v=20260829161541">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        .standings-header {
            padding: var(--space-lg) 0 var(--space-md);
            border-bottom: 2px solid var(--primary-red);
            margin-bottom: var(--space-lg);
        }
        .standings-header h2 { margin-bottom: 4px; }
        .standings-meta {
            font-family: var(--font-title);
            font-size: .85rem;
            color: var(--text-gray);
            letter-spacing: .5px;
        }
        .standings-scroll {
            overflow-x: auto;
            -webkit-overflow-scrolling: touch;
        }
        .standings-table {
            width: 100%;
            min-width: 700px;
            border-collapse: collapse;
            font-family: var(--font-title);
            font-size: .88rem;
        }
        .standings-table thead {
            position: sticky;
            top: 0;
            z-index: 2;
        }
        .standings-table th {
            background: #1a1a1a;
            color: rgba(170,170,170,.6);
            font-size: .68rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: .6px;
            padding: 10px 8px;
            text-align: center;
            border-bottom: 2px solid rgba(255,255,255,.08);
            cursor: pointer;
            user-select: none;
            white-space: nowrap;
            transition: color .15s;
        }
        .standings-table th:hover { color: var(--accent-yellow); }
        .standings-table th.sort-active { color: var(--primary-red); }
        .standings-table th.sort-active::after {
            content: ' ▾';
            font-size: .6rem;
        }
        .standings-table th.sort-active.sort-asc::after { content: ' ▴'; }
        .standings-table th.th-rank { width: 36px; text-align: center; }
        .standings-table th.th-team { text-align: left; min-width: 80px; }
        .standings-table th.th-record { min-width: 70px; }

        .standings-table td {
            padding: 9px 8px;
            text-align: center;
            border-bottom: 1px solid rgba(255,255,255,.04);
            color: var(--text-white);
            vertical-align: middle;
        }
        .standings-table tbody tr { transition: background .12s; }
        .standings-table tbody tr:hover { background: rgba(255,255,255,.03); }
        .standings-table tbody tr.my-team { background: rgba(255,182,18,.06); }
        .standings-table tbody tr.my-team:hover { background: rgba(255,182,18,.1); }

        .td-rank {
            font-family: var(--font-mono);
            font-weight: 700;
            font-size: .9rem;
            color: var(--primary-red);
        }
        .td-team {
            text-align: left;
            font-weight: 700;
        }
        .td-team-abbr {
            font-family: var(--font-mono);
            font-weight: 700;
            font-size: .85rem;
        }
        .td-record {
            font-family: var(--font-mono);
            font-size: .82rem;
        }
        .td-opponent {
            font-family: var(--font-mono);
            font-size: .78rem;
            color: var(--text-gray);
        }
        .td-score {
            font-family: var(--font-mono);
            font-weight: 700;
            font-size: .85rem;
        }
        .td-score .win { color: #22c55e; }
        .td-score .loss { color: var(--primary-red); }
        .td-score .tie { color: var(--text-gray); }
        .td-cat {
            font-family: var(--font-mono);
            font-size: .8rem;
            color: rgba(170,170,170,.7);
        }

        /* Category group dividers */
        .th-bat-start { border-left: 2px solid rgba(255,255,255,.08); }
        .th-pitch-start { border-left: 2px solid rgba(255,255,255,.08); }
        .td-bat-start { border-left: 2px solid rgba(255,255,255,.04); }
        .td-pitch-start { border-left: 2px solid rgba(255,255,255,.04); }

        /* Display-only categories (H/AB, IP) — slightly muted */
        .th-display { color: rgba(170,170,170,.35); font-style: italic; }
        .td-display { color: rgba(170,170,170,.45); }

        /* IP Min risk coloring — placed after .td-display so it wins the tie */
        .ip-risk-red { color: #ef4444; font-weight: 700; }
        .ip-risk-yellow { color: #eab308; font-weight: 700; }
        .ip-risk-green { color: #22c55e; font-weight: 700; }

        /* Category leader highlight (Leaders toggle) */
        .cat-leader-league { color: var(--accent-yellow); font-weight: 800; }
        .cat-leader-division { color: #38bdf8; font-weight: 800; }

        .leaders-legend {
            display: none;
            flex-basis: 100%;
            font-family: var(--font-title);
            font-size: .68rem;
            letter-spacing: .3px;
            color: rgba(170,170,170,.8);
        }
        .leaders-legend.visible { display: flex; gap: 14px; margin-top: 2px; }
        .leaders-legend .legend-item { display: inline-flex; align-items: center; gap: 5px; white-space: nowrap; }
        .leaders-legend .legend-swatch { width: 8px; height: 8px; border-radius: 2px; }
        .leaders-legend .legend-swatch.league { background: var(--accent-yellow); }
        .leaders-legend .legend-swatch.division { background: #38bdf8; }

        .th-gb { min-width: 46px; }
        .td-gb { font-family: var(--font-mono); font-size: .82rem; color: var(--text-gray); }

        /* League / Divisional + Leaders toggle controls */
        .standings-controls {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            gap: 8px;
            margin: 10px 0 14px;
        }
        .standings-view-toggle {
            display: inline-flex;
            border: 1px solid rgba(255,255,255,.15);
            border-radius: 6px;
            overflow: hidden;
        }
        .view-toggle-btn {
            background: transparent;
            border: none;
            color: rgba(170,170,170,.8);
            font-family: var(--font-title);
            font-size: .72rem;
            font-weight: 700;
            letter-spacing: .5px;
            text-transform: uppercase;
            padding: 7px 14px;
            cursor: pointer;
            transition: background .12s, color .12s;
        }
        .standings-view-toggle .view-toggle-btn + .view-toggle-btn {
            border-left: 1px solid rgba(255,255,255,.15);
        }
        .view-toggle-btn.active { background: var(--primary-red); color: #fff; }
        .view-toggle-btn:not(.active):hover { background: rgba(255,255,255,.06); }
        #leadersToggle {
            border: 1px solid rgba(255,255,255,.15);
            border-radius: 6px;
        }
        #leadersToggle.active { background: var(--accent-yellow); color: #1a1a1a; border-color: var(--accent-yellow); }

        .division-header-row td {
            background: #1a1a1a;
            color: var(--accent-yellow);
            font-family: var(--font-title);
            font-weight: 800;
            font-size: .72rem;
            letter-spacing: .6px;
            text-transform: uppercase;
            text-align: left;
            padding: 8px;
            border-top: 2px solid rgba(255,255,255,.1);
            border-bottom: 1px solid rgba(255,255,255,.1);
        }

        .scroll-hint {
            text-align: center;
            color: rgba(170,170,170,.3);
            font-family: var(--font-title);
            font-size: .7rem;
            padding: 6px 0;
            letter-spacing: .5px;
        }

        @media (max-width: 768px) {
            .standings-table { font-size: .78rem; }
            .standings-table th { font-size: .6rem; padding: 8px 5px; }
            .standings-table td { padding: 7px 5px; }
        }

        /* ── Matchups: bracket-grouped cards with expandable category detail ──
           Bracket comes from Yahoo's is_consolation flag, not from seeding --
           the commissioner re-ranks by hand (1 seed picks its opponent), so
           anything derived from rank would be wrong. */
        .matchups-section { margin-bottom: var(--space-lg); }
        .matchups-header { display: flex; align-items: baseline; gap: 12px; flex-wrap: wrap; margin-bottom: 10px; }
        .matchups-header h3 {
            font-family: var(--font-title);
            font-size: .95rem;
            letter-spacing: .6px;
            text-transform: uppercase;
            margin: 0;
        }
        .matchups-meta {
            font-family: var(--font-title);
            font-size: .68rem;
            letter-spacing: .3px;
            color: rgba(170,170,170,.8);
        }

        .mu-group { margin-bottom: 14px; }
        .mu-group-title {
            font-family: var(--font-title);
            font-weight: 800;
            font-size: .72rem;
            letter-spacing: .6px;
            text-transform: uppercase;
            color: var(--accent-yellow);
            background: #1a1a1a;
            padding: 8px;
            border-top: 2px solid rgba(255,255,255,.1);
            border-bottom: 1px solid rgba(255,255,255,.1);
        }

        .mu-card { border: 1px solid rgba(255,255,255,.08); border-top: none; }
        .mu-card.mine { border-left: 3px solid var(--accent-yellow); }
        .mu-head {
            display: flex;
            align-items: center;
            gap: 10px;
            width: 100%;
            padding: 10px 12px;
            background: transparent;
            border: none;
            color: inherit;
            cursor: pointer;
            text-align: left;
        }
        .mu-team { display: flex; flex-direction: column; flex: 1; min-width: 0; }
        .mu-team.right { align-items: flex-end; text-align: right; }
        .mu-abbr { font-family: var(--font-title); font-weight: 800; font-size: .85rem; letter-spacing: .5px; }
        .mu-rec { font-family: var(--font-mono); font-size: .7rem; color: var(--text-gray); }
        .mu-score { display: flex; align-items: center; gap: 6px; font-family: var(--font-mono); font-size: 1.05rem; font-weight: 700; }
        .mu-score .lead { color: var(--accent-yellow); }
        .mu-dash { color: rgba(170,170,170,.5); }
        .mu-caret { color: rgba(170,170,170,.5); font-size: .75rem; transition: transform .15s ease; }
        .mu-card.open .mu-caret { transform: rotate(180deg); }

        .mu-body { display: none; padding: 0 12px 10px; }
        .mu-card.open .mu-body { display: block; }
        .mu-cats { width: 100%; border-collapse: collapse; }
        .mu-cats td { padding: 4px 6px; font-family: var(--font-mono); font-size: .8rem; border-top: 1px solid rgba(255,255,255,.05); }
        .mu-cats tr td:first-child { text-align: right; width: 38%; }
        .mu-cats tr td:last-child { text-align: left; width: 38%; }
        .mu-cat {
            text-align: center;
            font-family: var(--font-title);
            font-size: .68rem;
            letter-spacing: .4px;
            color: rgba(170,170,170,.8);
            text-transform: uppercase;
        }
        /* Same accent the standings Leaders toggle uses, so "winning this
           category" reads identically in both places. */
        .mu-val.leader { color: var(--accent-yellow); font-weight: 800; }
        .mu-display { color: rgba(170,170,170,.45); font-style: italic; }

        @media (max-width: 768px) {
            .mu-abbr { font-size: .78rem; }
            .mu-cats td { font-size: .74rem; }
        }
    </style>

    <script>
    (async function () {
        'use strict';

        const DATA = window.FBPHub?.config?.dataPath || './data/';

        // ── Category direction (Leaders toggle) ─────────────────────────
        // Explicitly "lower is better": ERA, P_HR (pitching HR allowed).
        // ER / H/9 / BB/9 / P_TB added on the same logic (fewer runs/
        // baserunners allowed = better pitching) — remove any of these if
        // that's not how your scoring treats them.
        // 'K' here is BATTING strikeouts (stat_id 21); pitching strikeouts are
        // 'P_K' and stay higher-is-better. Confirmed against Yahoo's own scoring:
        // in WIZ vs LFB (week 22) counting category winners gives 8-10 with K to
        // WIZ, but Yahoo reports 7-11 -- which reconciles only if the lower
        // strikeout total wins the category.
        const LOWER_IS_BETTER = new Set(['ERA', 'ER', 'P_HR', 'H/9', 'BB/9', 'P_TB', 'K']);

        // Yahoo sends sort_order per stat ("0" = lower is better, "1" = higher).
        // Prefer it when present; fall back to the hand-maintained set above for
        // data written before that field was captured. This also settles cases
        // the hardcoded set never covered -- e.g. batting K, where "most
        // strikeouts" was being flagged as the category leader.
        function catLowerIsBetter(c) {
            const so = c?.sort_order;
            if (so === '0' || so === 0) return true;
            if (so === '1' || so === 1) return false;
            return LOWER_IS_BETTER.has(c?.display_name);
        }

        // Load standings + manager/division data
        let data, managersData;
        try {
            const [sr, mr] = await Promise.all([
                fetch(DATA + 'standings.json', { cache: 'no-store' }),
                fetch('./config/managers.json', { cache: 'no-store' }),
            ]);
            data = sr.ok ? await sr.json() : null;
            managersData = mr.ok ? await mr.json() : null;
        } catch { data = null; managersData = null; }

        if (!data || !data.standings) {
            document.getElementById('standingsMeta').textContent = 'No standings data available.';
            return;
        }

        // Division groupings — sourced from config/managers.json's per-team
        // "division" field (Constitution Article 7: Stanky's Grave / Charlie
        // Hustle / Colossus of Clout). If managers.json is ever missing the
        // field, the Divisional toggle just renders empty groups rather than
        // guessing.
        const DIVISION_ORDER = ["Stanky's Grave", "Charlie Hustle", "Colossus of Clout"];
        const TEAM_DIVISIONS = {};
        DIVISION_ORDER.forEach(d => { TEAM_DIVISIONS[d] = []; });
        Object.entries(managersData?.teams || {}).forEach(([abbr, info]) => {
            const div = info?.division;
            if (!div) return;
            if (!TEAM_DIVISIONS[div]) TEAM_DIVISIONS[div] = [];
            TEAM_DIVISIONS[div].push(abbr);
        });

        // Meta
        document.getElementById('standingsMeta').textContent =
            `Week ${data.week || '?'} · Updated ${data.date || '?'}`;

        // Get user team for highlighting
        let myTeam = null;
        try {
            if (typeof authManager !== 'undefined' && authManager.isAuthenticated?.())
                myTeam = authManager.getTeam?.()?.abbreviation?.toUpperCase();
        } catch {}

        // All categories including display-only (H/AB, IP)
        const cats = data.stat_categories || [];
        // First category with stat_id >= 24 is pitching
        const pitchIdx = cats.findIndex(c => parseInt(c.stat_id) >= 24);
        const batCats = pitchIdx > 0 ? cats.slice(0, pitchIdx) : cats;
        const pitchCats = pitchIdx > 0 ? cats.slice(pitchIdx) : [];
        const allCats = [...batCats, ...pitchCats];
        const totalCols = 6 + allCats.length; // LR, Team, Record, GB, vs, Score + categories

        // Sort / view state
        let sortKey = 'live_rank';
        let sortAsc = true;
        let viewMode = 'league';   // 'league' | 'divisional'
        let showLeaders = false;

        function parseRecord(rec) {
            try {
                const parts = String(rec || '0-0-0').split('-').map(x => parseInt(x, 10) || 0);
                return [parts[0] || 0, parts[1] || 0, parts[2] || 0];
            } catch {
                return [0, 0, 0];
            }
        }

        function computeOverallRecord(s) {
            if (s?.overall_live_record) return s.overall_live_record;
            const [rw, rl, rt] = parseRecord(s?.record);
            const [lw, ll, lt] = parseRecord(s?.live_record);
            return `${rw + lw}-${rl + ll}-${rt + lt}`;
        }

        function computeOverallPct(s) {
            const explicit = Number(s?.overall_live_win_pct);
            if (Number.isFinite(explicit)) return explicit;
            const [w, l, t] = parseRecord(computeOverallRecord(s));
            const total = w + l + t;
            return total > 0 ? (w + 0.5 * t) / total : 0;
        }

        function buildDerivedRankMap(rows) {
            const ranked = [...rows].sort((a, b) => {
                const pa = computeOverallPct(a);
                const pb = computeOverallPct(b);
                if (pb !== pa) return pb - pa;
                const sa = parseInt(a?.score) || 0;
                const sb = parseInt(b?.score) || 0;
                return sb - sa;
            });
            const map = new Map();
            ranked.forEach((row, idx) => map.set(row.team, idx + 1));
            return map;
        }

        // Games back off the same overall-live record the rank column uses.
        function computeGB(team, leader) {
            const [tw, tl] = parseRecord(computeOverallRecord(team));
            const [lw, ll] = parseRecord(computeOverallRecord(leader));
            return ((lw - tw) + (tl - ll)) / 2;
        }

        // League-wide best value per scored category (skips display-only cats).
        function computeCategoryLeaders(rows) {
            const leaders = {};
            allCats.forEach(c => {
                if (c.display_only) return;
                const lowerBetter = catLowerIsBetter(c);
                let best = null;
                rows.forEach(r => {
                    const val = parseFloat(r.categories?.[c.display_name]);
                    if (isNaN(val)) return;
                    if (best === null || (lowerBetter ? val < best : val > best)) best = val;
                });
                if (best === null) return;
                const winners = new Set();
                rows.forEach(r => {
                    const val = parseFloat(r.categories?.[c.display_name]);
                    if (!isNaN(val) && val === best) winners.add(r.team);
                });
                leaders[c.display_name] = winners;
            });
            return leaders;
        }

        function ipRiskClass(val) {
            const n = parseFloat(val);
            if (isNaN(n)) return '';
            if (n < 25) return ' ip-risk-red';
            if (n < 35) return ' ip-risk-yellow';
            return ' ip-risk-green';
        }

        // Build header
        function renderHead() {
            let html = '<tr>';
            html += `<th class="th-rank" data-sort="live_rank">LR</th>`;
            html += `<th class="th-team" data-sort="team">Team</th>`;
            html += `<th class="th-record" data-sort="live_win_pct">Record</th>`;
            html += `<th class="th-gb" data-sort="gb">GB</th>`;
            html += `<th data-sort="opponent">vs</th>`;
            html += `<th data-sort="score">Score</th>`;

            batCats.forEach((c, i) => {
                const cls = (i === 0 ? ' th-bat-start' : '') + (c.display_only ? ' th-display' : '');
                html += `<th class="${cls}" data-sort="cat_${c.display_name}" title="${c.name}">${c.display_name}</th>`;
            });
            pitchCats.forEach((c, i) => {
                const cls = (i === 0 ? ' th-pitch-start' : '') + (c.display_only ? ' th-display' : '');
                html += `<th class="${cls}" data-sort="cat_${c.display_name}" title="${c.name}">${c.display_name}</th>`;
            });

            html += '</tr>';
            document.getElementById('standingsHead').innerHTML = html;

            // Mark active sort
            document.querySelectorAll('.standings-table th').forEach(th => {
                th.classList.remove('sort-active', 'sort-asc');
                if (th.dataset.sort === sortKey) {
                    th.classList.add('sort-active');
                    if (sortAsc) th.classList.add('sort-asc');
                }
            });
        }

        function sortRows(rows, derivedRankMap) {
            return [...rows].sort((a, b) => {
                let va, vb;
                if (sortKey.startsWith('cat_')) {
                    const catName = sortKey.slice(4);
                    va = parseFloat(a.categories?.[catName]) || 0;
                    vb = parseFloat(b.categories?.[catName]) || 0;
                } else if (sortKey === 'score') {
                    va = parseInt(a.score) || 0;
                    vb = parseInt(b.score) || 0;
                } else if (sortKey === 'live_win_pct') {
                    va = computeOverallPct(a);
                    vb = computeOverallPct(b);
                } else if (sortKey === 'live_rank') {
                    va = derivedRankMap.get(a.team) || a.live_rank || 99;
                    vb = derivedRankMap.get(b.team) || b.live_rank || 99;
                } else if (sortKey === 'team' || sortKey === 'opponent') {
                    va = (a[sortKey] || '').toLowerCase();
                    vb = (b[sortKey] || '').toLowerCase();
                    return sortAsc ? va.localeCompare(vb) : vb.localeCompare(va);
                } else {
                    va = a[sortKey] || 0;
                    vb = b[sortKey] || 0;
                }
                return sortAsc ? va - vb : vb - va;
            });
        }

        function renderRow(s, derivedRankMap, categoryLeaders, divCategoryLeaders) {
            const isMe = myTeam && s.team.toUpperCase() === myTeam;
            const w = parseInt(s.score) || 0;
            const l = parseInt(s.opponent_score) || 0;
            const t = parseInt(s.ties) || 0;
            const rank = derivedRankMap.get(s.team) || s.live_rank || '—';

            let html = `<tr class="${isMe ? 'my-team' : ''}">`;
            html += `<td class="td-rank">${rank}</td>`;
            html += `<td class="td-team"><span class="td-team-abbr">${s.team}</span></td>`;
            html += `<td class="td-record">${computeOverallRecord(s)}</td>`;
            html += `<td class="td-gb">${(s.gb || 0) <= 0.05 ? '—' : s.gb.toFixed(1)}</td>`;
            html += `<td class="td-opponent">${s.opponent || '—'}</td>`;
            html += `<td class="td-score"><span class="win">${w}</span>-<span class="loss">${l}</span>-<span class="tie">${t}</span></td>`;

            const catCell = (c, i, startCls) => {
                const cls = (i === 0 ? ` ${startCls}` : '') + (c.display_only ? ' td-display' : '');
                const val = s.categories?.[c.display_name] ?? '—';
                let extra = c.display_name === 'IP' ? ipRiskClass(val) : '';
                // League leader wins the color if a team is both (it always is,
                // within its own division) -- division-only leaders get the 2nd color.
                if (showLeaders) {
                    if (categoryLeaders[c.display_name]?.has(s.team)) {
                        extra += ' cat-leader-league';
                    } else if (divCategoryLeaders && divCategoryLeaders[c.display_name]?.has(s.team)) {
                        extra += ' cat-leader-division';
                    }
                }
                return `<td class="td-cat${cls}${extra}">${val}</td>`;
            };

            batCats.forEach((c, i) => { html += catCell(c, i, 'td-bat-start'); });
            pitchCats.forEach((c, i) => { html += catCell(c, i, 'td-pitch-start'); });

            html += '</tr>';
            return html;
        }

        // Build body
        function renderBody() {
            const rows = data.standings || [];
            const derivedRankMap = buildDerivedRankMap(rows);
            const leagueLeader = rows.find(r => (derivedRankMap.get(r.team) || 99) === 1) || rows[0];
            const categoryLeaders = showLeaders ? computeCategoryLeaders(rows) : {};

            let html = '';
            if (viewMode === 'divisional') {
                for (const divName of DIVISION_ORDER) {
                    const teamList = TEAM_DIVISIONS[divName] || [];
                    const groupRowsRaw = rows.filter(r => teamList.includes(r.team));
                    if (!groupRowsRaw.length) continue;

                    // GB is relative to this division's own #1 seed here, not
                    // the league leader -- the LR column still shows league-wide
                    // rank, matching how Yahoo's own standings page splits it.
                    const divRankMap = buildDerivedRankMap(groupRowsRaw);
                    const divLeader = groupRowsRaw.find(r => (divRankMap.get(r.team) || 99) === 1) || groupRowsRaw[0];
                    groupRowsRaw.forEach(r => { r.gb = computeGB(r, divLeader); });

                    // Division-only category leaders (best within just these 4
                    // teams) -- kept separate from the league-wide categoryLeaders
                    // so renderRow can color the two distinctly.
                    const divCategoryLeaders = showLeaders ? computeCategoryLeaders(groupRowsRaw) : {};

                    const groupRows = sortRows(groupRowsRaw, derivedRankMap);
                    html += `<tr class="division-header-row"><td colspan="${totalCols}">${divName}</td></tr>`;
                    groupRows.forEach(s => { html += renderRow(s, derivedRankMap, categoryLeaders, divCategoryLeaders); });
                }
            } else {
                rows.forEach(r => { r.gb = leagueLeader ? computeGB(r, leagueLeader) : 0; });
                sortRows(rows, derivedRankMap).forEach(s => { html += renderRow(s, derivedRankMap, categoryLeaders); });
            }
            document.getElementById('standingsBody').innerHTML = html;
        }

        // ── Matchups (bracket-grouped, per-category leaders) ────────────
        // Bracket membership comes from Yahoo's own is_consolation flag. It is
        // deliberately NOT derived from seeding: the commissioner re-ranks the
        // bracket by hand (the 1 seed picks its opponent), so rank-based
        // grouping would silently disagree with the real bracket.
        const STATUS_LABEL = { preevent: 'Not started', midevent: 'In progress', postevent: 'Final' };

        function standingsRow(abbr) {
            const key = String(abbr || '').toUpperCase();
            return (data.standings || []).find(s => String(s.team).toUpperCase() === key);
        }

        function matchupCard(mu) {
            const t1 = mu.team1 || {}, t2 = mu.team2 || {};
            const r1 = standingsRow(t1.team), r2 = standingsRow(t2.team);
            const s1 = parseInt(t1.score) || 0, s2 = parseInt(t2.score) || 0;
            const mine = !!myTeam && [t1.team, t2.team]
                .some(x => String(x || '').toUpperCase() === myTeam);

            let rows = '';
            allCats.forEach(c => {
                const nm = c.display_name;
                const raw1 = t1.categories?.[nm], raw2 = t2.categories?.[nm];
                let w1 = '', w2 = '';
                // Display-only cats (H/AB, IP) are shown but never score, so
                // they get no leader mark.
                if (!c.display_only) {
                    const a = parseFloat(raw1), b = parseFloat(raw2);
                    if (!isNaN(a) && !isNaN(b) && a !== b) {
                        if (catLowerIsBetter(c) ? a < b : a > b) w1 = ' leader';
                        else w2 = ' leader';
                    }
                }
                const dim = c.display_only ? ' mu-display' : '';
                rows += `<tr>`
                     +  `<td class="mu-val${w1}${dim}">${raw1 ?? '—'}</td>`
                     +  `<td class="mu-cat${dim}" title="${c.name}">${nm}</td>`
                     +  `<td class="mu-val${w2}${dim}">${raw2 ?? '—'}</td>`
                     +  `</tr>`;
            });

            // The viewer's own matchup starts expanded; the rest collapse so
            // four 22-row tables don't bury the standings below.
            return `<div class="mu-card${mine ? ' mine open' : ''}">
                <button class="mu-head" type="button" aria-expanded="${mine ? 'true' : 'false'}">
                    <span class="mu-team">
                        <span class="mu-abbr">${t1.team || '—'}</span>
                        <span class="mu-rec">${r1?.live_record || ''}</span>
                    </span>
                    <span class="mu-score">
                        <span class="${s1 > s2 ? 'lead' : ''}">${s1}</span>
                        <span class="mu-dash">–</span>
                        <span class="${s2 > s1 ? 'lead' : ''}">${s2}</span>
                    </span>
                    <span class="mu-team right">
                        <span class="mu-abbr">${t2.team || '—'}</span>
                        <span class="mu-rec">${r2?.live_record || ''}</span>
                    </span>
                    <i class="fas fa-chevron-down mu-caret"></i>
                </button>
                <div class="mu-body"><table class="mu-cats"><tbody>${rows}</tbody></table></div>
            </div>`;
        }

        function renderMatchups() {
            const section = document.getElementById('matchupsSection');
            const wrap = document.getElementById('matchupsBrackets');
            const mus = data.matchups || [];
            if (!section || !wrap || !mus.length) return;

            const status = STATUS_LABEL[mus[0]?.status] || '';
            const round = data.playoff_round ? `Round ${data.playoff_round}` : `Week ${data.week ?? '?'}`;
            const metaEl = document.getElementById('matchupsMeta');
            if (metaEl) metaEl.textContent = [round, status].filter(Boolean).join(' · ');

            // Playoff matchups arrive interleaved (championship, consolation,
            // championship, consolation), so group explicitly rather than
            // trusting array order.
            const groups = mus.some(m => m.is_playoffs)
                ? [
                    ['Championship Bracket', mus.filter(m => m.is_playoffs && !m.is_consolation)],
                    ['Consolation Bracket', mus.filter(m => m.is_consolation)],
                  ].filter(g => g[1].length)
                : [[`Week ${data.week ?? '?'} Matchups`, mus]];

            wrap.innerHTML = groups.map(([label, list]) =>
                `<div class="mu-group"><div class="mu-group-title">${label}</div>`
                + list.map(matchupCard).join('')
                + `</div>`
            ).join('');
            section.hidden = false;
        }

        document.getElementById('matchupsBrackets')?.addEventListener('click', e => {
            const head = e.target.closest('.mu-head');
            if (!head) return;
            const card = head.closest('.mu-card');
            const open = card.classList.toggle('open');
            head.setAttribute('aria-expanded', open ? 'true' : 'false');
        });
        

        // Sort click handler
        document.getElementById('standingsTable').addEventListener('click', e => {
            const th = e.target.closest('th[data-sort]');
            if (!th) return;
            const key = th.dataset.sort;
            if (sortKey === key) {
                sortAsc = !sortAsc;
            } else {
                sortKey = key;
                // Default descending for stats, ascending for rank/team/gb
                sortAsc = (key === 'live_rank' || key === 'team' || key === 'opponent' || key === 'gb');
            }
            renderHead();
            renderBody();
        });

        // Leaders legend -- shown only while the Leaders toggle is active;
        // text adapts depending on whether Divisional grouping is also on.
        function updateLeadersLegend() {
            const el = document.getElementById('leadersLegend');
            if (!el) return;
            if (!showLeaders) {
                el.classList.remove('visible');
                el.innerHTML = '';
                return;
            }
            let html = '<span class="legend-item"><span class="legend-swatch league"></span>League leader</span>';
            if (viewMode === 'divisional') {
                html += '<span class="legend-item"><span class="legend-swatch division"></span>Division leader</span>';
            }
            el.innerHTML = html;
            el.classList.add('visible');
        }

        // League / Divisional toggle
        document.getElementById('viewToggle')?.addEventListener('click', e => {
            const btn = e.target.closest('.view-toggle-btn');
            if (!btn) return;
            viewMode = btn.dataset.view;
            document.querySelectorAll('#viewToggle .view-toggle-btn').forEach(b => b.classList.toggle('active', b === btn));
            updateLeadersLegend();
            renderBody();
        });

        // Leaders toggle
        document.getElementById('leadersToggle')?.addEventListener('click', () => {
            showLeaders = !showLeaders;
            document.getElementById('leadersToggle').classList.toggle('active', showLeaders);
            updateLeadersLegend();
            renderBody();
        });

        renderMatchups();
        renderHead();
        renderBody();
    })();
    </script>
</body>
</html>
