<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Draft Preview - FBP Hub</title>
    <!-- Favicon and App Icons -->
    <link rel="icon" type="image/x-icon" href="/favicon.ico">
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png">
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png">
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">
    <link rel="manifest" href="/site.webmanifest">
    <meta name="theme-color" content="#EF3E42">
    <link rel="stylesheet" href="css/styles.css">
    <link rel="stylesheet" href="css/draft.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="draft-preview-page">
    <nav class="mobile-nav">
        <div class="nav-container">
            <button class="nav-toggle" id="navToggle">
                <i class="fas fa-bars"></i>
            </button>
            <div class="nav-brand">
                <h1>FBP HUB 3.0</h1>
                <p class="season-year">Est. 2012</p>
            </div>
            <div class="user-menu" id="userMenu"></div>
        </div>
                <div class="nav-menu" id="navMenu">
            <a href="index.html" class="nav-link">
                <i class="fas fa-home"></i>
                <span>Home</span>
            </a>
            <a href="constitution.html" class="nav-link">
                <i class="fas fa-scroll"></i>
                <span>Constitution</span>
            </a>
            <a href="players.html" class="nav-link">
                <i class="fas fa-users"></i>
                <span>Players</span>
            </a>
            <a href="rosters.html" class="nav-link">
                <i class="fas fa-baseball-ball"></i>
                <span>Rosters</span>
            </a>
            <a href="player-log.html" class="nav-link">
                <i class="fas fa-clipboard-list"></i>
                <span>Player Log</span>
            </a>
            <a href="wizbucks.html" class="nav-link">
                <i class="fas fa-coins"></i>
                <span>WizBucks</span>
            </a>
            <a href="draft-preview.html" class="nav-link active">
                <i class="fas fa-clipboard-list"></i>
                <span>Draft Preview</span>
            </a>
        </div>
    </nav>

    <main class="container-draft">
        <!-- Draft Header -->
        <div class="draft-header">
            <div class="draft-title-section">
                <h2 id="draftTitle">DRAFT PREVIEW</h2>
                <div class="draft-status-badge" id="draftStatus">
                    <i class="fas fa-calendar"></i>
                    <span id="statusText">PRE-DRAFT</span>
                </div>
            </div>
            <div class="draft-round-info" id="draftInfo">
                <!-- Populated by JS -->
            </div>
        </div>

        <!-- Draft Type Toggle -->
        <div class="view-toggle">
            <button class="view-btn active" data-tab="keeper">
                <i class="fas fa-baseball-ball"></i> Keeper Draft
            </button>
            <button class="view-btn" data-tab="prospect">
                <i class="fas fa-seedling"></i> Prospect Draft
            </button>
        </div>

        <!-- Keeper Draft Tab -->
        <div class="draft-view active" id="keeper-view">
            <div class="recent-picks-header">
                <h3>Available Keeper Players</h3>
                <div class="controls-row">
                    <div class="search-bar-inline">
                        <i class="fas fa-search"></i>
                        <input type="text" id="keeperSearch" placeholder="Search players...">
                    </div>
                    <span class="picks-count" id="keeperCount">0 players</span>
                </div>
            </div>
            
            <div class="player-grid" id="keeperGrid"></div>
        </div>

        <!-- Prospect Draft Tab -->
        <div class="draft-view" id="prospect-view">
            <!-- Prospect Filters -->
            <div class="prospect-filters-section">
                <h4 class="filters-title">Choose Your Filters</h4>
                <div class="prospect-filters-grid">
                    <div class="filter-group">
                        <label for="fvYearFilter">FV Year</label>
                        <select id="fvYearFilter" class="prospect-filter-select">
                            <option value="2024" selected>2024</option>
                            <option value="2025">2025</option>
                            <option value="2026">2026</option>
                        </select>
                    </div>
                    <div class="filter-group">
                        <label for="statusFilter">Status</label>
                        <select id="statusFilter" class="prospect-filter-select">
                            <option value="any" selected>Any Prospect</option>
                            <option value="fypd">FYPD</option>
                            <option value="int_signee">Int Signee</option>
                            <option value="debuted">Debuted</option>
                            <option value="dropped">Dropped</option>
                            <option value="standard">Standard</option>
                        </select>
                    </div>
                    <div class="filter-group">
                        <label for="positionFilter">Position</label>
                        <select id="positionFilter" class="prospect-filter-select">
                            <option value="any" selected>Any</option>
                            <option value="P">P</option>
                            <option value="RHP">RHP</option>
                            <option value="LHP">LHP</option>
                            <option value="INF">INF</option>
                            <option value="OF">OF</option>
                            <option value="C">C</option>
                            <option value="1B">1B</option>
                            <option value="2B">2B</option>
                            <option value="3B">3B</option>
                            <option value="SS">SS</option>
                        </select>
                    </div>
                    <div class="filter-group">
                        <label for="badgeTypeFilter">Badge Type</label>
                        <select id="badgeTypeFilter" class="prospect-filter-select">
                            <option value="any" selected>Any</option>
                            <optgroup label="Top 100">
                                <option value="2026 Top 100">2026 Top 100</option>
                                <option value="2025 Top 100">2025 Top 100</option>
                                <option value="2024 Top 100">2024 Top 100</option>
                            </optgroup>
                            <optgroup label="Org Top 10">
                                <option value="2026 Org Top 10">2026 Org Top 10</option>
                                <option value="2025 Org Top 10">2025 Org Top 10</option>
                                <option value="2024 Org Top 10">2024 Org Top 10</option>
                            </optgroup>
                            <optgroup label="FYPD Top 20">
                                <option value="2025 FYPD Top 20">2025 FYPD Top 20</option>
                                <option value="2024 FYPD Top 20">2024 FYPD Top 20</option>
                            </optgroup>
                            <optgroup label="INT Top 10">
                                <option value="2026 INT Top 10">2026 INT Top 10</option>
                                <option value="2025 INT Top 10">2025 INT Top 10</option>
                            </optgroup>
                            <optgroup label="POS Top 10">
                                <option value="2026 POS Top 10">2026 POS Top 10</option>
                                <option value="2025 POS Top 10">2025 POS Top 10</option>
                                <option value="2024 POS Top 10">2024 POS Top 10</option>
                            </optgroup>
                            <optgroup label="MLB Futures">
                                <option value="2025 MLB Futures">2025 MLB Futures</option>
                                <option value="2024 MLB Futures">2024 MLB Futures</option>
                            </optgroup>
                        </select>
                    </div>
                </div>
            </div>
            
            <!-- Search and Count -->
            <div class="prospect-search-row">
                <div class="search-bar-inline">
                    <i class="fas fa-search"></i>
                    <input type="text" id="prospectSearch" placeholder="Search prospects...">
                </div>
                <span class="picks-count" id="prospectCount">0 prospects</span>
            </div>
            
            <!-- Prospect Table -->
            <div class="prospect-table-container">
                <table class="prospect-table" id="prospectTable">
                    <thead>
                        <tr>
                            <th class="sortable" data-sort="name">PROSPECT <i class="fas fa-sort"></i></th>
                            <th class="sortable" data-sort="org">Org <i class="fas fa-sort"></i></th>
                            <th class="sortable" data-sort="position">POS <i class="fas fa-sort"></i></th>
                            <th class="sortable" data-sort="fv">FV <i class="fas fa-sort"></i></th>
                            <th class="sortable" data-sort="badges">Badges <i class="fas fa-sort"></i></th>
                            <th class="sortable" data-sort="status">Status <i class="fas fa-sort"></i></th>
                        </tr>
                    </thead>
                    <tbody id="prospectTableBody">
                        <!-- Populated by JS -->
                    </tbody>
                </table>
            </div>
            
            <!-- Load More -->
            <div class="prospect-load-more" id="prospectLoadMore" style="display: none;">
                <button class="btn-secondary" onclick="loadMoreProspects()">
                    <i class="fas fa-plus"></i> Load More
                </button>
            </div>
        </div>
    </main>

    <!-- Bottom Navigation -->
    <nav class="bottom-nav">
        <a href="index.html" class="bottom-nav-item">
            <i class="fas fa-home"></i>
            <span>Home</span>
        </a>
        <a href="draft.html" class="bottom-nav-item is-active">
            <i class="fas fa-table-list"></i>
            <span>Draft</span>
        </a>
        <a href="dashboard.html" class="bottom-nav-item">
            <i class="fas fa-tachometer-alt"></i>
            <span>Dashboard</span>
        </a>
        <button class="bottom-nav-item" id="bottomMenuToggle" type="button">
            <i class="fas fa-bars"></i>
            <span>Menu</span>
        </button>
    </nav>

    <footer class="site-footer">
        <p><strong>Fantasy Baseball Pantheon</strong> &copy; 2012-2025</p>
    </footer>

    <script src="js/main.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/player-profile.js"></script>
    <script src="js/draft-preview.js"></script>
    <script>
        if (typeof FBPHub !== 'undefined') {
            FBPHub.on('ready', () => {
                if (typeof initDraftPreview === 'function') {
                    initDraftPreview();
                }
            });
        } else {
            document.addEventListener('DOMContentLoaded', () => {
                if (typeof initDraftPreview === 'function') {
                    initDraftPreview();
                }
            });
        }
    </script>
</body>
</html>
